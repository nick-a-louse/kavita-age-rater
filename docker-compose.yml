services:
  rater:
    build: .
    image: kavita-age-rater
    container_name: kavita-age-rater
    restart: unless-stopped
    # Run as the host 'readonly-user' user so state files under /opt/appdata are
    # owned by that account and editable without sudo.
    user: "1009:1009"
    env_file: .env
    ports:
      # Web UI: browse to http://<server>:HOST_PORT
      - "${HOST_PORT:-5058}:8080"
    volumes:
      # Persistent state (SQLite db, log). On the server DATA_PATH is set in .env
      # (e.g. /opt/appdata/kavita-age-rater); defaults to ./data locally.
      - ${DATA_PATH:-./data}:/data
